name: Deploy

# Merge to main → build ZIP → SBOM → keyless signature → (approval) → verify → Lambda.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits instead of cancelling one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ZIP: apps/api/dist/foresight-web.zip
  FUNCTION_NAME: foresight-prod-web
  SITE_URL: https://d1fsk10xga8rek.cloudfront.net
  # The only identity allowed to have signed what we deploy: this workflow, on main.
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: Build, SBOM, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless: GitHub OIDC token → short-lived Fulcio certificate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lambda

      # The ZIP holds an esbuild bundle, so Syft would see no packages inside it.
      # The SBOM is built from the workspace lockfile — everything that went into the build.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: foresight-web.spdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Copied next to the SBOM so all three files land flat in the workflow artifact.
      - name: Sign ZIP (keyless, entry in Rekor)
        run: |
          cp "$ZIP" foresight-web.zip
          cosign sign-blob --yes --bundle foresight-web.zip.sigstore.json foresight-web.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foresight-web
          path: |
            foresight-web.zip
            foresight-web.zip.sigstore.json
            foresight-web.spdx.json
          if-no-files-found: error

  deploy:
    name: Verify and deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production # approval gate + the only `sub` the AWS role trusts
    permissions:
      id-token: write # OIDC to AWS
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foresight-web

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Deploy exactly what this workflow signed on main — anything else stops here.
      - name: Verify signature
        run: >-
          cosign verify-blob
          --bundle foresight-web.zip.sigstore.json
          --certificate-identity "$SIGNER_IDENTITY"
          --certificate-oidc-issuer "$SIGNER_ISSUER"
          foresight-web.zip

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: deploy-${{ github.run_id }}

      - name: Upload code and publish version
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://foresight-web.zip --output text --query CodeSha256
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda publish-version --function-name "$FUNCTION_NAME" \
            --description "commit ${GITHUB_SHA}" --output text --query Version

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "$SITE_URL/api/health"
