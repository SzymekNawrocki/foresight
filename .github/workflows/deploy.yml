name: Deploy

# Merge to main → build ZIPs → SBOM → keyless signatures → (approval) → verify → Lambdas.
on:
  push:
    branches: [main]
    # Only what can change a ZIP; docs-only or infra-only merges do not redeploy.
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits instead of cancelling one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Each foresight-<name>.zip goes to the Lambda foresight-prod-<name>.
  FUNCTIONS: web ingest
  SITE_URL: https://d1fsk10xga8rek.cloudfront.net
  # The only identity allowed to have signed what we deploy: this workflow, on main.
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: Build, SBOM, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless: GitHub OIDC token → short-lived Fulcio certificate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lambda

      # The ZIP holds an esbuild bundle, so Syft would see no packages inside it.
      # The SBOM is built from the workspace lockfile — everything that went into the build.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: foresight.spdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Copied next to the SBOM so all files land flat in the workflow artifact.
      - name: Sign ZIPs (keyless, entries in Rekor)
        run: |
          cp apps/api/dist/foresight-web.zip apps/ingest/dist/foresight-ingest.zip .
          for name in $FUNCTIONS; do
            cosign sign-blob --yes --bundle "foresight-$name.zip.sigstore.json" "foresight-$name.zip"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foresight-lambdas
          path: |
            foresight-*.zip
            foresight-*.zip.sigstore.json
            foresight.spdx.json
          if-no-files-found: error

  deploy:
    name: Verify and deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production # approval gate + the only `sub` the AWS role trusts
    permissions:
      id-token: write # OIDC to AWS
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foresight-lambdas

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Deploy exactly what this workflow signed on main — anything else stops here.
      - name: Verify signatures
        run: |
          for name in $FUNCTIONS; do
            cosign verify-blob \
              --bundle "foresight-$name.zip.sigstore.json" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "foresight-$name.zip"
          done

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: deploy-${{ github.run_id }}

      - name: Upload code and publish versions
        run: |
          for name in $FUNCTIONS; do
            fn="foresight-prod-$name"
            aws lambda update-function-code --function-name "$fn" \
              --zip-file "fileb://foresight-$name.zip" --output text --query CodeSha256
            aws lambda wait function-updated-v2 --function-name "$fn"
            aws lambda publish-version --function-name "$fn" \
              --description "commit ${GITHUB_SHA}" --output text --query Version
          done

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "$SITE_URL/api/health"
